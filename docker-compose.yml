version: '1'

services:
  InSoLiToDatabase2:
    image: neo4j:4.4.3
    hostname: neodb
    environment:
      - NEO4J_AUTH=none
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_connector_https_advertised__address=:443
    volumes:
      - type: bind
        source: ./DB/InSoLiToImport
        target: /var/lib/neo4j/import
      - ./DB/LOGS:/logs
      - ./DB/DATA:/data
      - ./DB/PLUGINS/neo4j-graph-data-science-1.8.3.jar:/var/lib/neo4j/plugins/graph-data-science.jar
      - ./DB/PLUGINS/apoc-4.4.0.3-all.jar:/var/lib/neo4j/plugins/apoc.jar
      - ./DB/CONF:/var/lib/neo4j/conf
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    restart: unless-stopped
  
  NuxtBuild:
    image: node:24
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/FRONTEND-nuxt
    volumes:
      - type: bind
        source: ./FRONTEND-nuxt
        target: /workspace/FRONTEND-nuxt
      - type: bind
        source: ./DB
        target: /workspace/DB
        read_only: true
    command: sh -c "npm ci && npm run generate"

  ApacheServer2:
    image: httpd:2.4.52
    depends_on:
      NuxtBuild:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./FRONTEND-nuxt/.output/public
        target: /usr/local/apache2/htdocs/
        read_only: true
      - type: bind
        source: apache-setup/insolito-httpd.conf
        target: /usr/local/apache2/conf/httpd.conf
        read_only: true
      - type: bind
        source: apache-setup/neo4j-reverse-proxy.conf
        target: /usr/local/apache2/conf/extra/neo4j-reverse-proxy.conf
        read_only: true
    ports:
      - "${INSOLITO_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  InSoLiToWB:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${MTU:-1500}
